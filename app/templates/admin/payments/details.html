{% extends 'admin/model/details.html' %}

{% block head_css %}
    {{ super() }}

    <style>
        .vitalyx-payment-details {
            color: var(--adm-text);
        }

        .vitalyx-payment-details .table {
            background: var(--adm-surface);
            border: 1px solid var(--adm-border);
            border-radius: 12px;
            overflow: hidden;
        }

        .vitalyx-payment-details .table th {
            width: 25%;
            background: var(--adm-surface-alt);
            color: var(--adm-text-muted);
            font-size: 12px;
            font-weight: 700;
            padding: 16px;
        }

        .vitalyx-payment-details .table td {
            color: var(--adm-text);
            font-size: 13px;
            padding: 16px;
            vertical-align: middle;
        }

        .payment-status {
            display: inline-block;
            padding: 5px 11px;
            border-radius: 30px;
            font-size: 11px;
            font-weight: 800;
            white-space: nowrap;
        }

        .payment-status--pending {
            color: #d97706;
            background: rgba(245, 158, 11, 0.15);
        }

        .payment-status--approved {
            color: #10b981;
            background: rgba(16, 185, 129, 0.15);
        }

        .payment-status--rejected {
            color: #ef4444;
            background: rgba(239, 68, 68, 0.15);
        }

        @media (max-width: 768px) {
            .vitalyx-payment-details .table th {
                width: 35%;
            }
        }
    </style>
{% endblock %}

{% block body %}
<div class="vitalyx-payment-details">
    {{ super() }}
</div>
{% endblock %}
